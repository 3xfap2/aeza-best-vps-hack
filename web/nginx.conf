# Сайт и панель: статика + прокси к API. Работает от непривилегированного пользователя на порту 8080.
# Заголовки безопасности сайта — в каждом location со статикой (nginx не наследует add_header,
# если в location есть свой); ответы API несут свои заголовки (их ставит сервер API).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;

    location /api/v1/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api|metrics|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;   # с портом — для проверки Origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location / {
        try_files $uri /index.html;
        # Скрипты — только свои (без inline и eval); стили — свои и Google Fonts;
        # 'unsafe-inline' в style-src нужен для style-атрибутов интерфейса, скриптов он не касается.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }
}
