# Локальный OIDC-провайдер для демонстрации входа через SSO.
# Браузер ходит на localhost:5556, сервер API — на dex:5556 (см. OIDC_ISSUER в compose.yaml).
issuer: http://localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: churn-radar
    name: Радар оттока
    secretEnv: OIDC_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8080/api/v1/auth/oidc/callback
enablePasswordDB: true
# Демо-учётка SSO: marketing@radar.example / radar-sso-2026 (bcrypt-хеш ниже).
staticPasswords:
  - email: marketing@radar.example
    hash: "$2b$10$teZudv/hbiS2zY6bMeoKcOJHji8J2G6vl.7N3Pdpc5QE/JQu8AgUO"
    username: Маркетолог
    userID: 3b0a6f6e-5c1e-4c55-9d4f-1d3c2c7b9a10
