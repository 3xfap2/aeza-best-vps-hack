# Дополнение для сервера: docker compose -f compose.yaml -f compose.server.yaml up -d
# Готовит его deploy/server.sh. Отличия от локального запуска:
# - сайт на порту 80, Prometheus — только внутри сервера (Grafana и SSO открыты: дашборд без персональных данных);
# - адреса панели и SSO — из .env (PUBLIC_URL, OIDC_PUBLIC_ISSUER), конфиг Dex — сгенерированный под адрес сервера.
services:
  api:
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      OIDC_PUBLIC_ISSUER: ${OIDC_PUBLIC_ISSUER}
    restart: always

  ingest:
    restart: always

  web:
    ports: !override
      - "80:8080"
    restart: always

  db:
    restart: always

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
    restart: always

  grafana:
    restart: always

  dex:
    volumes: !override
      - ./dex/config.server.yaml:/etc/dex/config.yaml:ro
    restart: always
