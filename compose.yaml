name: churn-radar

x-secrets: &secrets
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-radar-demo-2026}
  METRICS_TOKEN: ${METRICS_TOKEN:-radar-metrics-demo-token}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-radar-oidc-demo-secret}

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-radar-db-demo}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *secrets
      DATABASE_URL: postgresql://radar:${DB_PASSWORD:-radar-db-demo}@db:5432/radar
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      SEED_PATH: /app/data/demo/data.json
      CASE_PATH: /app/data/case/data.json
      DEMO_PATH: /app/data/demo/data.json
      PUBLIC_URL: http://localhost:8080
      OIDC_ISSUER: http://dex:5556/dex
      OIDC_PUBLIC_ISSUER: http://localhost:5556/dex
      OIDC_CLIENT_ID: churn-radar
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LINK_CODE: ${TELEGRAM_LINK_CODE:-}
      TELEGRAM_DIGEST_HOUR: ${TELEGRAM_DIGEST_HOUR:-9}
      AI_PROVIDER: ${AI_PROVIDER:-off}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_FOLDER_ID: ${AI_FOLDER_ID:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_SCOPE: ${AI_SCOPE:-}
      AI_CA_BUNDLE: ${AI_CA_BUNDLE:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-radar-metrics-demo-token}
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$METRICS_TOKEN\" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-radar-grafana-demo}
      # Только агрегаты (суммы и число клиентов), без персональных данных — дашборд открыт на просмотр
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/churn-radar.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.43.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-radar-oidc-demo-secret}
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    restart: unless-stopped

volumes:
  pgdata:
